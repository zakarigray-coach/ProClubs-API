name: GafferGPT foundation
on:
  push:
    paths: ['gaffergpt/**', '.github/workflows/gaffergpt.yml']
  pull_request:
    paths: ['gaffergpt/**', '.github/workflows/gaffergpt.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gaffergpt/requirements.txt
      - run: python -m unittest discover -s gaffergpt/tests -v
