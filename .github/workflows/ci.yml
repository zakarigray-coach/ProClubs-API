name: BluShade CI

on:
  push:
    branches:
      - main
      - 'blushade/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: blushade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Dependency audit report
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
